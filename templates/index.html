<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Food Finder</title>
  <style>
    :root {
      --bg: #14100e;
      --card: #201a17;
      --line: #3a2f29;
      --text: #f3ece6;
      --muted: #b09a8c;
      --accent: #ff7a45;
      --accent-2: #ffb347;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a201b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin: 0; }
    .group { margin-bottom: 26px; }
    .group h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muted); margin: 0 0 12px; font-weight: 600;
    }
    .opts { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #1a1310;
      font-weight: 600;
    }
    .go {
      display: block; width: 100%; margin-top: 14px;
      padding: 16px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1310; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: transform 0.1s, opacity 0.2s;
    }
    .go:hover { transform: translateY(-1px); }
    .go:disabled { opacity: 0.5; cursor: default; transform: none; }
    #results { margin-top: 34px; }
    .blurb { color: var(--muted); white-space: pre-wrap; line-height: 1.6; margin-bottom: 20px; }
    .place {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 15px 18px; margin-bottom: 10px;
      text-decoration: none; color: var(--text);
      transition: border-color 0.15s;
    }
    .place:hover { border-color: var(--accent); }
    .place .name { font-weight: 600; }
    .place .go-arrow { color: var(--accent); font-size: 1.3rem; }
    .status { text-align: center; color: var(--muted); padding: 20px; }
    .err { color: #ff8f7a; }
    .loc { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🍽️ Mood Food Finder</h1>
      <p>No typing. Just tap your vibe and go.</p>
    </header>

    <div class="group" data-key="mood">
      <h2>What's the mood?</h2>
      <div class="opts">
        <div class="chip">Cozy</div>
        <div class="chip">Adventurous</div>
        <div class="chip">Celebratory</div>
        <div class="chip">Comfort</div>
        <div class="chip">Healthy</div>
        <div class="chip">Indulgent</div>
      </div>
    </div>

    <div class="group" data-key="walk">
      <h2>How far will you walk?</h2>
      <div class="opts">
        <div class="chip">5</div>
        <div class="chip">10</div>
        <div class="chip">15</div>
        <div class="chip">30</div>
      </div>
    </div>

    <div class="group" data-key="budget">
      <h2>Budget</h2>
      <div class="opts">
        <div class="chip">$</div>
        <div class="chip">$$</div>
        <div class="chip">$$$</div>
        <div class="chip">$$$$</div>
      </div>
    </div>

    <div class="group" data-key="food">
      <h2>Food type</h2>
      <div class="opts">
        <div class="chip">Italian</div>
        <div class="chip">Asian</div>
        <div class="chip">Mexican</div>
        <div class="chip">American</div>
        <div class="chip">Cafe</div>
        <div class="chip">Surprise me</div>
      </div>
    </div>

    <button class="go" id="go">Find my spot →</button>
    <div class="loc" id="loc">📍 Using your current location</div>

    <div id="results"></div>
  </div>

  <script>
    const selections = {};
    let coords = { latitude: null, longitude: null };

    // Grab geolocation up front (falls back to server default if denied).
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coords.latitude = pos.coords.latitude;
          coords.longitude = pos.coords.longitude;
          document.getElementById('loc').textContent = '📍 Using your current location';
        },
        () => {
          document.getElementById('loc').textContent = '📍 Location off — using a default area';
        }
      );
    }

    // Single-select chips per group.
    document.querySelectorAll('.group').forEach((group) => {
      const key = group.dataset.key;
      group.querySelectorAll('.chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const wasActive = chip.classList.contains('active');
          group.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
          if (!wasActive) {
            chip.classList.add('active');
            selections[key] = chip.textContent.trim();
          } else {
            delete selections[key];
          }
        });
      });
    });

    const go = document.getElementById('go');
    const results = document.getElementById('results');

    go.addEventListener('click', async () => {
      go.disabled = true;
      results.innerHTML = '<div class="status">Sniffing out the best spots… 🍜</div>';

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...selections, ...coords }),
        });
        const data = await res.json();

        if (data.error) {
          results.innerHTML = '<div class="status err">Hmm: ' + data.error + '</div>';
        } else {
          let html = '';
          if (data.text) html += '<div class="blurb">' + escapeHtml(data.text) + '</div>';
          (data.places || []).forEach((p) => {
            html += '<a class="place" href="' + p.url + '" target="_blank" rel="noopener">' +
                    '<span class="name">' + escapeHtml(p.name) + '</span>' +
                    '<span class="go-arrow">›</span></a>';
          });
          if (!html) html = '<div class="status">No matches — try a different combo.</div>';
          results.innerHTML = html;
        }
      } catch (e) {
        results.innerHTML = '<div class="status err">Something went wrong. Is the server running?</div>';
      } finally {
        go.disabled = false;
      }
    });

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
