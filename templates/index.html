<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Food Finder</title>
  <style>
    :root {
      --bg: #14100e;
      --card: #201a17;
      --line: #3a2f29;
      --text: #f3ece6;
      --muted: #b09a8c;
      --accent: #ff7a45;
      --accent-2: #ffb347;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a201b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 640px; margin: 0 auto; padding: 24px 20px 40px;
      min-height: 100dvh;
      display: flex; flex-direction: column; justify-content: center;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 34px; margin-bottom: 40px;
    }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--line); transition: background 0.2s;
    }
    .dot.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .back {
      background: none; border: none; padding: 6px 4px;
      color: var(--muted); font-size: 0.9rem; font-family: inherit; cursor: pointer;
    }
    .back:hover { color: var(--text); }
    .back[hidden] { display: none; }

    h2.q {
      font-size: 1.9rem; line-height: 1.2; letter-spacing: -0.5px;
      margin: 0 0 28px; text-align: center;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 110px; padding: 14px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      color: var(--text); font-family: inherit; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s, transform 0.1s;
    }
    .tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; }
    .tile:active { transform: scale(0.97); }
    .tile .emoji { font-size: 1.8rem; line-height: 1; }
    .tile .sub { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
    .tile.picked {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; color: #1a1310;
    }
    .tile.picked .sub { color: #1a1310; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 26px 22px; text-align: center;
    }
    .card .name { display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.4px; }
    .card .maps {
      display: inline-block; margin-top: 14px;
      color: var(--accent); text-decoration: none; font-weight: 600;
    }
    .card .maps:hover { text-decoration: underline; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 15px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1310; font-family: inherit; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.ghost {
      background: none; border: 1px solid var(--line);
      color: var(--muted); font-weight: 600;
    }
    .btn.ghost:hover { border-color: var(--accent); color: var(--text); }

    .blurb { color: var(--muted); white-space: pre-wrap; line-height: 1.6; margin: 14px 0 0; text-align: left; }
    .meta {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px;
    }
    .meta span {
      font-size: 0.78rem; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    }
    .status { text-align: center; color: var(--muted); padding: 20px; }
    .err { color: #ff8f7a; }
    .loc { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 28px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    #stage { animation: fadeUp 0.18s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #stage { animation: none; }
      .tile, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage"></div>
    <div class="loc" id="loc">📍 Using your current location</div>
  </div>

  <script>
    // Questions are built by the server from real nearby places, so this file only
    // renders whatever tiles it is handed — it never hard-codes an option.
    let session = null;
    let question = null;
    let asked = 0;
    let maxQuestions = 4;
    let places = [];
    let pickIndex = 0;

    const stage = document.getElementById('stage');
    const locEl = document.getElementById('loc');

    function locate() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve({});
        // Don't strand the user on a permission prompt they never answer.
        const timer = setTimeout(() => resolve({}), 8000);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
          },
          () => { clearTimeout(timer); resolve({}); },
          { timeout: 8000 }
        );
      });
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return res.json();
    }

    async function begin() {
      stage.innerHTML = '<div class="status">Looking around your neighbourhood… 🗺️</div>';
      restage();
      locEl.hidden = true;

      const coords = await locate();
      locEl.textContent = coords.latitude
        ? '📍 Using your current location'
        : '📍 Location off — using a default area';

      try {
        const data = await post('/api/start', coords);
        if (data.error) return showMessage(data.error, true);
        session = data.session;
        locEl.textContent += ' · ' + data.found + ' places nearby';
        handle(data);
      } catch (e) {
        showMessage('Something went wrong. Is the server running?', true);
      }
    }

    function handle(data) {
      asked = data.asked || 0;
      if (data.max_questions) maxQuestions = data.max_questions;
      if (data.done) {
        places = data.places || [];
        pickIndex = 0;
        if (!places.length) showMessage('No matches — start over and try a wider net.');
        else renderPick();
      } else {
        question = data.question;
        renderQuestion(data.remaining);
      }
    }

    function renderQuestion(remaining) {
      const total = Math.max(maxQuestions, asked + 1);
      let dots = '';
      for (let i = 0; i < total; i++) dots += '<div class="dot' + (i <= asked ? ' on' : '') + '"></div>';

      const tiles = question.options.map((o, i) =>
        '<button class="tile" data-i="' + i + '">' +
          (o.emoji ? '<span class="emoji">' + escapeHtml(o.emoji) + '</span>' : '') +
          '<span>' + escapeHtml(o.label) + '</span>' +
          (o.sub && o.sub !== o.label ? '<span class="sub">' + escapeHtml(o.sub) + '</span>' : '') +
        '</button>'
      ).join('');

      stage.innerHTML =
        '<div class="topbar"><div class="dots">' + dots + '</div></div>' +
        '<h2 class="q">' + escapeHtml(question.title) + '</h2>' +
        '<div class="tiles">' + tiles + '</div>';
      restage();
      locEl.hidden = false;
      if (remaining) locEl.textContent = '📍 ' + remaining + ' places still in the running';

      stage.querySelectorAll('.tile').forEach((tile) => {
        tile.addEventListener('click', () => pick(tile));
      });
    }

    async function pick(tile) {
      const opt = question.options[Number(tile.dataset.i)];
      stage.querySelectorAll('.tile').forEach((t) => { t.classList.remove('picked'); t.disabled = true; });
      tile.classList.add('picked');

      setTimeout(async () => {
        stage.innerHTML = '<div class="status">Narrowing it down… 🍜</div>';
        restage();
        try {
          const data = await post('/api/answer', { session, key: question.key, value: opt.value });
          if (data.error) return showMessage(data.error, true);
          handle(data);
        } catch (e) {
          showMessage('Something went wrong. Is the server running?', true);
        }
      }, 140);
    }

    document.addEventListener('keydown', (e) => {
      const tiles = stage.querySelectorAll('.tile');
      if (/^[1-9]$/.test(e.key) && tiles.length) {
        const t = tiles[Number(e.key) - 1];
        if (t && !t.disabled) pick(t);
      }
    });

    function renderPick() {
      const p = places[pickIndex];
      const bits = [];
      if (p.walk) bits.push(p.walk + ' min walk');
      if (p.price) bits.push(p.price);
      if (p.rating) bits.push('★ ' + p.rating);
      if (p.kind) bits.push(p.kind);

      let html = '<div class="card">';
      html += '<span class="name">' + escapeHtml(p.name) + '</span>';
      html += '<div class="meta">' + bits.map((b) => '<span>' + escapeHtml(b) + '</span>').join('') + '</div>';
      if (p.reason) html += '<p class="blurb">' + escapeHtml(p.reason) + '</p>';
      html += '<a class="maps" target="_blank" rel="noopener">Open in Maps ›</a></div>';
      html += '<div class="actions">';
      if (places.length > 1) html += '<button class="btn" id="another">Show me another →</button>';
      html += '<button class="btn ghost" id="restart">Start over</button></div>';

      stage.innerHTML = html;
      restage();
      locEl.hidden = true;

      // Set href via the DOM so a hostile URL can't break out of the attribute.
      const mapsLink = stage.querySelector('.maps');
      if (p.url) mapsLink.href = p.url;
      else mapsLink.remove();

      const another = document.getElementById('another');
      if (another) another.addEventListener('click', () => {
        pickIndex = (pickIndex + 1) % places.length;
        renderPick();
      });
      document.getElementById('restart').addEventListener('click', begin);
    }

    function showMessage(msg, isErr) {
      stage.innerHTML = '<div class="status' + (isErr ? ' err' : '') + '">' + escapeHtml(msg) + '</div>' +
        '<div class="actions"><button class="btn" id="restart">Start over</button></div>';
      restage();
      locEl.hidden = true;
      document.getElementById('restart').addEventListener('click', begin);
    }

    // Retrigger the fade-up animation on each render.
    function restage() {
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }

    begin();
  </script>
</body>
</html>
