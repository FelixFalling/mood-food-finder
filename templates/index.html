<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Food Finder</title>
  <style>
    :root {
      --bg: #14100e;
      --card: #201a17;
      --line: #3a2f29;
      --text: #f3ece6;
      --muted: #b09a8c;
      --accent: #ff7a45;
      --accent-2: #ffb347;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a201b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 640px; margin: 0 auto; padding: 24px 20px 40px;
      min-height: 100dvh;
      display: flex; flex-direction: column; justify-content: center;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 34px; margin-bottom: 40px;
    }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--line); transition: background 0.2s;
    }
    .dot.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .back {
      background: none; border: none; padding: 6px 4px;
      color: var(--muted); font-size: 0.9rem; font-family: inherit; cursor: pointer;
    }
    .back:hover { color: var(--text); }
    .back[hidden] { display: none; }

    h2.q {
      font-size: 1.9rem; line-height: 1.2; letter-spacing: -0.5px;
      margin: 0 0 28px; text-align: center;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 110px; padding: 14px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      color: var(--text); font-family: inherit; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s, transform 0.1s;
    }
    .tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; }
    .tile:active { transform: scale(0.97); }
    .tile .emoji { font-size: 1.8rem; line-height: 1; }
    .tile .sub { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
    .tile.picked {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; color: #1a1310;
    }
    .tile.picked .sub { color: #1a1310; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 26px 22px; text-align: center;
    }
    .card .name { display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.4px; }
    .card .maps {
      display: inline-block; margin-top: 14px;
      color: var(--accent); text-decoration: none; font-weight: 600;
    }
    .card .maps:hover { text-decoration: underline; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 15px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1310; font-family: inherit; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.ghost {
      background: none; border: 1px solid var(--line);
      color: var(--muted); font-weight: 600;
    }
    .btn.ghost:hover { border-color: var(--accent); color: var(--text); }

    .blurb { color: var(--muted); white-space: pre-wrap; line-height: 1.6; margin: 14px 0 0; text-align: left; }
    .status { text-align: center; color: var(--muted); padding: 20px; }
    .err { color: #ff8f7a; }
    .loc { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 28px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    #stage { animation: fadeUp 0.18s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #stage { animation: none; }
      .tile, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage"></div>
    <div class="loc" id="loc">📍 Using your current location</div>
  </div>

  <script>
    const STEPS = [
      { key: 'mood', title: "What's the mood?", options: [
          { label: 'Cozy', emoji: '🕯️' },
          { label: 'Adventurous', emoji: '🌶️' },
          { label: 'Celebratory', emoji: '🥂' },
          { label: 'Comfort', emoji: '🍲' },
          { label: 'Healthy', emoji: '🥗' },
          { label: 'Indulgent', emoji: '🧁' },
        ] },
      { key: 'food', title: 'What are you craving?', options: [
          { label: 'Mexican', emoji: '🌮' },
          { label: 'Italian', emoji: '🍝' },
          { label: 'Chinese', emoji: '🥡' },
          { label: 'Japanese', emoji: '🍣' },
          { label: 'American', emoji: '🍔' },
          { label: 'Thai', emoji: '🍜' },
          { label: 'Indian', emoji: '🍛' },
          { label: 'Cafe', emoji: '☕' },
          { label: 'Surprise me', emoji: '🎲' },
        ] },
      // `label` stays a bare number — the server writes "a {walk}-minute walk".
      { key: 'walk', title: 'How far will you walk?', options: [
          { label: '5', emoji: '🚶', sub: '5 min' },
          { label: '10', emoji: '🚶', sub: '10 min' },
          { label: '15', emoji: '🥾', sub: '15 min' },
          { label: '30', emoji: '🗺️', sub: '30 min' },
        ] },
      { key: 'budget', title: "What's the budget?", options: [
          { label: '$', emoji: '🪙', sub: 'Cheap eats' },
          { label: '$$', emoji: '💵', sub: 'Casual' },
          { label: '$$$', emoji: '💳', sub: 'Nice out' },
          { label: '$$$$', emoji: '💎', sub: 'Special' },
        ] },
    ];

    const selections = {};
    let coords = { latitude: null, longitude: null };
    let step = 0;
    let places = [];
    let pickIndex = 0;
    let blurb = '';

    const stage = document.getElementById('stage');
    const locEl = document.getElementById('loc');

    // Grab geolocation up front (falls back to server default if denied).
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coords.latitude = pos.coords.latitude;
          coords.longitude = pos.coords.longitude;
          locEl.textContent = '📍 Using your current location';
        },
        () => {
          locEl.textContent = '📍 Location off — using a default area';
        }
      );
    }

    function renderStep() {
      const s = STEPS[step];
      const dots = STEPS.map((_, i) => '<div class="dot' + (i <= step ? ' on' : '') + '"></div>').join('');
      const tiles = s.options.map((o, i) =>
        '<button class="tile" data-i="' + i + '">' +
          (o.emoji ? '<span class="emoji">' + o.emoji + '</span>' : '') +
          '<span>' + escapeHtml(o.sub || o.label) + '</span>' +
        '</button>'
      ).join('');

      stage.innerHTML =
        '<div class="topbar"><div class="dots">' + dots + '</div>' +
        '<button class="back"' + (step === 0 ? ' hidden' : '') + '>← Back</button></div>' +
        '<h2 class="q">' + escapeHtml(s.title) + '</h2>' +
        '<div class="tiles">' + tiles + '</div>';
      restage();
      locEl.hidden = false;

      const back = stage.querySelector('.back');
      if (back) back.addEventListener('click', goBack);

      stage.querySelectorAll('.tile').forEach((tile) => {
        tile.addEventListener('click', () => pick(tile));
      });
    }

    function pick(tile) {
      const s = STEPS[step];
      const opt = s.options[Number(tile.dataset.i)];
      selections[s.key] = opt.label;
      stage.querySelectorAll('.tile').forEach((t) => t.classList.remove('picked'));
      tile.classList.add('picked');
      stage.querySelectorAll('.tile').forEach((t) => (t.disabled = true));
      setTimeout(() => {
        if (step < STEPS.length - 1) {
          step += 1;
          renderStep();
        } else {
          submit();
        }
      }, 140);
    }

    function goBack() {
      if (step === 0) return;
      step -= 1;
      delete selections[STEPS[step].key];
      renderStep();
    }

    document.addEventListener('keydown', (e) => {
      const tiles = stage.querySelectorAll('.tile');
      if (e.key === 'Escape' || e.key === 'Backspace') {
        const back = stage.querySelector('.back');
        if (back && !back.hidden) { e.preventDefault(); goBack(); }
        return;
      }
      if (/^[1-9]$/.test(e.key) && tiles.length) {
        const t = tiles[Number(e.key) - 1];
        if (t && !t.disabled) pick(t);
      }
    });

    async function submit() {
      stage.innerHTML = '<div class="status">Sniffing out the best spots… 🍜</div>';
      restage();
      locEl.hidden = true;

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...selections, ...coords }),
        });
        const data = await res.json();

        if (data.error) {
          showMessage('Hmm: ' + data.error, true);
          return;
        }

        places = data.places || [];
        blurb = data.text || '';
        pickIndex = 0;

        if (!places.length && !blurb) {
          showMessage('No matches — try a different combo.');
        } else {
          renderPick();
        }
      } catch (e) {
        showMessage('Something went wrong. Is the server running?', true);
      }
    }

    function renderPick() {
      const p = places[pickIndex];
      // Per-place copy only — `blurb` names every option, which would defeat the one-at-a-time point.
      const copy = p ? p.reason : blurb;
      let html = '<div class="card">';
      if (p) html += '<span class="name">' + escapeHtml(p.name) + '</span>';
      if (copy) html += '<p class="blurb">' + escapeHtml(copy) + '</p>';
      html += '<a class="maps" target="_blank" rel="noopener">Open in Maps ›</a></div>';
      html += '<div class="actions">';
      if (places.length > 1) html += '<button class="btn" id="another">Show me another →</button>';
      html += '<button class="btn ghost" id="restart">Start over</button></div>';

      stage.innerHTML = html;
      restage();

      // Set href via the DOM so a hostile URL can't break out of the attribute.
      const maps = stage.querySelector('.maps');
      if (p && p.url) maps.href = p.url;
      else maps.remove();

      const another = document.getElementById('another');
      if (another) another.addEventListener('click', () => {
        pickIndex = (pickIndex + 1) % places.length;
        renderPick();
      });
      document.getElementById('restart').addEventListener('click', restart);
    }

    function showMessage(msg, isErr) {
      stage.innerHTML = '<div class="status' + (isErr ? ' err' : '') + '">' + escapeHtml(msg) + '</div>' +
        '<div class="actions"><button class="btn" id="restart">Start over</button></div>';
      restage();
      document.getElementById('restart').addEventListener('click', restart);
    }

    function restart() {
      STEPS.forEach((s) => delete selections[s.key]);
      places = [];
      blurb = '';
      pickIndex = 0;
      step = 0;
      renderStep();
    }

    // Retrigger the fade-up animation on each render.
    function restage() {
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    renderStep();
  </script>
</body>
</html>
