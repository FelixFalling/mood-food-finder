<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Food Finder</title>
  <style>
    :root {
      --bg: #f1f3f4;
      --surface: #ffffff;
      --line: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --blue: #1a73e8;
      --blue-dark: #1967d2;
      --blue-tint: #e8f0fe;
      --red: #ea4335;
      --green: #1e8e3e;
      --green-tint: #e6f4ea;
      --yellow: #fbbc05;
      --shadow-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2: 0 1px 2px rgba(60,64,67,.3), 0 8px 24px rgba(60,64,67,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle, #dfe3e6 1px, transparent 1px) 0 0 / 22px 22px,
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px; margin: 24px auto;
      min-height: calc(100dvh - 48px);
      background: var(--surface);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow-2);
      display: flex; flex-direction: column;
    }
    #stage { flex: 1; display: flex; flex-direction: column; }
    .pad {
      flex: 1; padding: 22px 20px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    @media (max-width: 520px) {
      .wrap { margin: 0; border-radius: 0; min-height: 100dvh; box-shadow: none; }
    }

    .topbar { display: flex; align-items: center; gap: 14px; min-height: 24px; margin-bottom: 36px; }
    .progress { display: flex; gap: 6px; flex: 1; }
    .seg { flex: 1; height: 4px; border-radius: 999px; background: var(--line); transition: background 0.2s; }
    .seg.on { background: var(--blue); }
    .back {
      background: none; border: none; padding: 4px; margin: -4px;
      color: var(--muted); font-size: 1.1rem; font-family: inherit; cursor: pointer;
      line-height: 1;
    }
    .back:hover { color: var(--text); }
    .back[hidden] { display: none; }

    h2.q {
      font-size: 1.55rem; line-height: 1.3; letter-spacing: -0.2px; font-weight: 600;
      margin: 0 0 24px; text-align: center;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 100px; padding: 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      color: var(--text); font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s, transform 0.1s;
    }
    .tile:hover, .tile:focus-visible { border-color: var(--blue); box-shadow: var(--shadow-1); outline: none; }
    .tile:active { transform: scale(0.97); }
    .tile .emoji { font-size: 1.7rem; line-height: 1; }
    .tile .sub { font-size: 0.78rem; font-weight: 500; color: var(--muted); }
    .tile.picked { background: var(--blue); border-color: var(--blue); color: #fff; }
    .tile.picked .sub { color: var(--blue-tint); }

    /* Results: a live map up top plus a Maps-style bottom sheet, so the best
       pick and its alternates read like pins you're browsing on a real map. */
    .map-wrap { position: relative; width: 100%; height: 38vh; min-height: 200px; max-height: 320px; background: #e8eaed; }
    .map-frame { width: 100%; height: 100%; }
    .map-pill {
      position: absolute; left: 14px; top: 14px; max-width: calc(100% - 28px);
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); padding: 6px 14px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: var(--text); box-shadow: var(--shadow-1);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .map-pill .ping { flex: none; width: 8px; height: 8px; border-radius: 999px; background: var(--red); }

    .sheet {
      position: relative; margin-top: -18px;
      background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 18px 20px 24px; flex: 1;
      box-shadow: 0 -2px 10px rgba(60,64,67,.12);
    }
    .handle { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 16px; }

    .pick-top { display: flex; align-items: flex-start; gap: 10px; }
    .pick-top .pin { font-size: 1.5rem; line-height: 1.3; }
    .pick-title { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.2px; }
    .badge {
      align-self: flex-start; background: var(--green-tint); color: var(--green);
      font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .blurb { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin: 10px 0 0; white-space: pre-wrap; text-align: left; }

    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      flex: 1; text-align: center; padding: 12px; border: none; border-radius: 999px;
      background: var(--blue); color: #fff; font-family: inherit; font-weight: 600; font-size: 0.95rem;
      text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .btn:hover { background: var(--blue-dark); box-shadow: var(--shadow-1); }
    .btn:active { transform: scale(0.98); }
    .btn.ghost { background: var(--surface); color: var(--blue); border: 1px solid var(--line); }
    .btn.ghost:hover { background: #f8f9fa; box-shadow: none; }

    .alt-label {
      font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 22px 0 10px;
    }
    .alt-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .alt-row::-webkit-scrollbar { display: none; }
    .alt-card {
      flex: 0 0 auto; max-width: 200px; display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 10px 14px; font-family: inherit; font-size: 0.86rem; font-weight: 600;
      color: var(--text); cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .alt-card:hover, .alt-card:focus-visible { border-color: var(--blue); background: var(--blue-tint); outline: none; }
    .alt-card .alt-pin { color: var(--blue); flex: none; }
    .alt-card .alt-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status { text-align: center; color: var(--muted); }
    .err { color: var(--red); }
    .loc {
      text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 26px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    #stage { animation: fadeUp 0.18s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #stage { animation: none; }
      .tile, .btn { transition: none; }
    }
    .photo {
      width: 100%; height: 150px; object-fit: cover;
      border-radius: 14px; margin-top: 14px; display: block; background: #e8eaed;
    }
    /* Facts pulled straight from the Places survey — walk time, price, rating. */
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .meta span {
      font-size: 0.74rem; font-weight: 600; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
    }
    .alt-card .alt-meta { color: var(--muted); font-weight: 500; flex: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage"></div>
  </div>

  <script>
    // Google bootstrap
    (g => {var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "{{ maps_api_key }}",
      v: "weekly",
    });
  </script>
  <script>
    // Questions are built server-side from the real places around you, so this file
    // never hard-codes an option — it renders whatever tiles it is handed.
    const DEFAULT_LAT = 34.050481;
    const DEFAULT_LON = -118.248526;

    let session = null;
    let question = null;
    let asked = 0;
    let maxQuestions = 4;
    let places = [];
    let pickIndex = 0;
    let coords = { latitude: null, longitude: null };
    let locText = '📍 Finding your area…';

    let map = null;
    let markersByIndex = {};
    let mode = 'WALK';        // how they're getting there; set by the first question
    const VERBS = { WALK: 'walk', TRANSIT: 'ride', DRIVE: 'drive' };
    let origin = null;        // where the search started from
    let originMarker = null;
    let routeLine = null;     // walking path to the selected place

    const stage = document.getElementById('stage');

    function locate() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve({});
        // Don't strand the user on a permission prompt they never answer.
        const timer = setTimeout(() => resolve({}), 8000);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
          },
          () => { clearTimeout(timer); resolve({}); },
          { timeout: 8000 }
        );
      });
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return res.json();
    }

    async function begin() {
      stage.innerHTML = '<div class="pad"><div class="status">Looking around your neighbourhood… 🗺️</div></div>';
      restage();

      places = [];
      pickIndex = 0;
      map = null;
      markersByIndex = {};
      originMarker = null;
      routeLine = null;

      coords = await locate();
      locText = coords.latitude
        ? '📍 Using your current location'
        : '📍 Location off — using a default area';

      try {
        const data = await post('/api/start', coords);
        if (data.error) return showMessage(data.error, true);
        session = data.session;
        origin = data.origin || null;
        handle(data);
      } catch (e) {
        showMessage('Something went wrong. Is the server running?', true);
      }
    }

    function handle(data) {
      asked = data.asked || 0;
      if (data.max_questions) maxQuestions = data.max_questions;
      if (data.mode) mode = data.mode;
      if (data.found) locText = '📍 ' + data.found + ' places within reach';
      if (data.done) {
        places = data.places || [];
        pickIndex = 0;
        if (!places.length) showMessage('No matches — start over and try a wider net.');
        else renderResults();
      } else {
        question = data.question;
        renderQuestion(data.remaining);
      }
    }

    function renderQuestion(remaining) {
      const total = Math.max(maxQuestions, asked + 1);
      let segs = '';
      for (let i = 0; i < total; i++) segs += '<div class="seg' + (i <= asked ? ' on' : '') + '"></div>';

      const tiles = question.options.map((o, i) =>
        '<button class="tile" data-i="' + i + '">' +
          (o.emoji ? '<span class="emoji">' + escapeHtml(o.emoji) + '</span>' : '') +
          '<span>' + escapeHtml(o.label) + '</span>' +
          // Case-insensitive, or "Any distance" prints its own subtitle back at itself.
          (o.sub && o.sub.toLowerCase() !== o.label.toLowerCase()
            ? '<span class="sub">' + escapeHtml(o.sub) + '</span>' : '') +
        '</button>'
      ).join('');

      const note = remaining ? '📍 ' + remaining + ' places still in the running' : locText;

      stage.innerHTML =
        '<div class="pad">' +
        '<div class="topbar"><div class="progress">' + segs + '</div></div>' +
        '<h2 class="q">' + escapeHtml(question.title) + '</h2>' +
        '<div class="tiles">' + tiles + '</div>' +
        '<div class="loc">' + escapeHtml(note) + '</div>' +
        '</div>';
      restage();

      stage.querySelectorAll('.tile').forEach((tile) => {
        tile.addEventListener('click', () => pick(tile));
      });
    }

    async function pick(tile) {
      const opt = question.options[Number(tile.dataset.i)];
      stage.querySelectorAll('.tile').forEach((t) => { t.classList.remove('picked'); t.disabled = true; });
      tile.classList.add('picked');

      setTimeout(async () => {
        stage.innerHTML = '<div class="pad"><div class="status">Narrowing it down… 🍜</div></div>';
        restage();
        try {
          const data = await post('/api/answer', { session, key: question.key, value: opt.value });
          if (data.error) return showMessage(data.error, true);
          handle(data);
        } catch (e) {
          showMessage('Something went wrong. Is the server running?', true);
        }
      }, 140);
    }

    document.addEventListener('keydown', (e) => {
      const tiles = stage.querySelectorAll('.tile');
      if (/^[1-9]$/.test(e.key) && tiles.length) {
        const t = tiles[Number(e.key) - 1];
        if (t && !t.disabled) pick(t);
      }
    });

    // Draws the map + bottom-sheet shell once, then loads the live map async
    // so the sheet (top pick + alternates) is usable even if maps can't load.
    function renderResults() {
      const hasMap = places.some((p) => p.lat != null && p.lng != null);
      let html = '';
      if (hasMap) {
        html += '<div class="map-wrap"><div id="map" class="map-frame"></div>' +
          '<div class="map-pill"><span class="ping"></span><span id="mapPillText">Loading map…</span></div></div>';
      }
      html += '<div class="sheet"><div class="handle"></div><div id="sheetBody"></div></div>';

      stage.innerHTML = html;
      restage();
      renderSheet();

      if (hasMap) {
        setupMap().catch(() => {
          const pillText = document.getElementById('mapPillText');
          if (pillText) pillText.textContent = 'Map unavailable';
        });
      }
    }

    async function setupMap() {
      const { Map } = await google.maps.importLibrary('maps');
      await google.maps.importLibrary('marker');
      // `geometry` decodes the encoded polyline the Routes API returns.
      await google.maps.importLibrary('geometry');

      const mapEl = document.getElementById('map');
      if (!mapEl) return; // user already navigated away

      map = new Map(mapEl, {
        center: { lat: coords.latitude || DEFAULT_LAT, lng: coords.longitude || DEFAULT_LON },
        zoom: 14,
        disableDefaultUI: true,
        zoomControl: true,
        gestureHandling: 'greedy',
      });

      const bounds = new google.maps.LatLngBounds();
      markersByIndex = {};

      // The survey already returned each place's coordinates, so markers drop
      // immediately — no per-place lookup through the Places library.
      places.forEach((p, i) => {
        if (p.lat == null || p.lng == null) return;
        const position = { lat: p.lat, lng: p.lng };
        const marker = new google.maps.Marker({
          position,
          map,
          title: p.name,
          icon: markerIcon(i === pickIndex),
          zIndex: i === pickIndex ? 999 : 1,
        });
        marker.addListener('click', () => selectPlace(i));
        markersByIndex[i] = { marker, location: position };
        bounds.extend(position);
      });

      // Where the search started from, drawn as a distinct blue dot rather than a pin
      // so it never reads as one of the results.
      const start = origin
        ? { lat: origin.lat, lng: origin.lng }
        : { lat: coords.latitude || DEFAULT_LAT, lng: coords.longitude || DEFAULT_LON };
      originMarker = new google.maps.Marker({
        position: start,
        map,
        title: 'You are here',
        zIndex: 500,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 7,
          fillColor: '#1a73e8',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 3,
        },
      });
      // Keep the searcher's own position in frame so the walk times make sense.
      bounds.extend(start);

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, 60);
        if (Object.keys(markersByIndex).length === 1) map.setZoom(15);
      }

      const pillText = document.getElementById('mapPillText');
      if (pillText) pillText.textContent = places[pickIndex] ? places[pickIndex].name : 'Map';

      drawRoute(pickIndex);
    }

    // Fetches the real walking path for one place and lays it over the map. Failures are
    // silent on purpose — a missing line shouldn't take the pins down with it.
    async function drawRoute(i) {
      const p = places[i];
      if (!map || !p || !p.id) return;

      try {
        const leg = await post('/api/route', { session, place_id: p.id });
        if (!leg || !leg.polyline || places[pickIndex] !== p) return;

        const path = google.maps.geometry.encoding.decodePath(leg.polyline);
        if (routeLine) routeLine.setMap(null);
        routeLine = new google.maps.Polyline({
          path,
          map,
          strokeColor: '#1a73e8',
          strokeOpacity: 0.85,
          strokeWeight: 5,
        });

        // The Routes walk time beats our straight-line estimate, so show it once we have it.
        p.route_minutes = leg.minutes;
        renderSheet();
      } catch (e) {
        // Leave the map as-is.
      }
    }

    function markerIcon(isTop) {
      return { url: 'https://maps.google.com/mapfiles/ms/icons/' + (isTop ? 'red-dot.png' : 'blue-dot.png') };
    }

    function selectPlace(i) {
      pickIndex = i;
      Object.entries(markersByIndex).forEach(([idx, entry]) => {
        const isTop = Number(idx) === i;
        entry.marker.setIcon(markerIcon(isTop));
        entry.marker.setZIndex(isTop ? 999 : 1);
      });
      const entry = markersByIndex[i];
      if (entry && map) map.panTo(entry.location);
      const pillText = document.getElementById('mapPillText');
      if (pillText) pillText.textContent = places[i].name;
      renderSheet();

      // Swap the path over to whichever place is now selected.
      if (routeLine) { routeLine.setMap(null); routeLine = null; }
      drawRoute(i);
    }

    function metaChips(p) {
      const bits = [];
      const verb = VERBS[mode] || 'walk';
      // Prefer the real routed time over the straight-line estimate.
      if (p.route_minutes) bits.push(p.route_minutes + ' min ' + verb);
      else if (p.minutes) bits.push(p.minutes + ' min ' + verb);
      if (p.price) bits.push(p.price);
      if (p.rating) bits.push('★ ' + p.rating + (p.reviews ? ' (' + p.reviews + ')' : ''));
      if (p.kind) bits.push(p.kind);
      if (p.open_now === true) bits.push('Open now');
      return bits;
    }

    // Rewrites just the bottom sheet (top pick + alternates) without touching
    // the map, so switching picks doesn't reload/re-fetch markers.
    function renderSheet() {
      const body = document.getElementById('sheetBody');
      if (!body) return;

      const p = places[pickIndex];
      const alts = places
        .map((place, i) => ({ place, i }))
        .filter(({ i }) => i !== pickIndex)
        .slice(0, 3);

      let html = '';
      if (p) {
        const chips = metaChips(p);
        html += '<div class="pick-top"><span class="pin">📍</span>' +
          '<div class="pick-title"><span class="name">' + escapeHtml(p.name) + '</span>' +
          '<span class="badge">Top pick</span></div></div>';
        if (chips.length) {
          html += '<div class="meta">' + chips.map((b) => '<span>' + escapeHtml(b) + '</span>').join('') + '</div>';
        }
        if (p.photo) html += '<img class="photo" id="placePhoto" alt="' + escapeHtml(p.name) + '" />';
        if (p.reason) html += '<p class="blurb">' + escapeHtml(p.reason) + '</p>';
        html += '<div class="actions"><a class="btn" id="directions" target="_blank" rel="noopener">Directions</a>' +
          '<button class="btn ghost" id="restart">Start over</button></div>';
      } else {
        html += '<div class="actions"><button class="btn ghost" id="restart">Start over</button></div>';
      }

      if (alts.length) {
        html += '<div class="alt-label">Other options nearby</div><div class="alt-row">';
        alts.forEach(({ place, i }) => {
          html += '<button class="alt-card" data-i="' + i + '"><span class="alt-pin">📍</span>' +
            '<span class="alt-name">' + escapeHtml(place.name) + '</span>' +
            (place.minutes ? '<span class="alt-meta">' + place.minutes + ' min</span>' : '') +
            '</button>';
        });
        html += '</div>';
      }

      body.innerHTML = html;

      // Set src/href via the DOM so a hostile URL can't break out of the attribute.
      const photoEl = document.getElementById('placePhoto');
      if (photoEl && p && p.photo) {
        photoEl.src = p.photo;
        photoEl.addEventListener('error', () => photoEl.remove());
      }

      const directions = document.getElementById('directions');
      if (directions) {
        if (p && p.url) directions.href = p.url;
        else directions.remove();
      }

      body.querySelectorAll('.alt-card').forEach((btn) => {
        btn.addEventListener('click', () => selectPlace(Number(btn.dataset.i)));
      });
      const restartBtn = document.getElementById('restart');
      if (restartBtn) restartBtn.addEventListener('click', begin);
    }

    function showMessage(msg, isErr) {
      stage.innerHTML = '<div class="pad"><div class="status' + (isErr ? ' err' : '') + '">' + escapeHtml(msg) + '</div>' +
        '<div class="actions"><button class="btn" id="restart">Start over</button></div></div>';
      restage();
      document.getElementById('restart').addEventListener('click', begin);
    }

    // Retrigger the fade-up animation on each render.
    function restage() {
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }

    begin();
  </script>
</body>
</html>
