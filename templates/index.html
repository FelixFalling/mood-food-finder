<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Food Finder</title>
  <style>
    :root {
      --bg: #f1f3f4;
      --surface: #ffffff;
      --line: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --blue: #1a73e8;
      --blue-dark: #1967d2;
      --blue-tint: #e8f0fe;
      --red: #ea4335;
      --green: #1e8e3e;
      --green-tint: #e6f4ea;
      --yellow: #fbbc05;
      --shadow-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2: 0 1px 2px rgba(60,64,67,.3), 0 8px 24px rgba(60,64,67,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle, #dfe3e6 1px, transparent 1px) 0 0 / 22px 22px,
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px; margin: 24px auto;
      min-height: calc(100dvh - 48px);
      background: var(--surface);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow-2);
      display: flex; flex-direction: column;
    }
    #stage { flex: 1; display: flex; flex-direction: column; }
    .pad {
      flex: 1; padding: 22px 20px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    @media (max-width: 520px) {
      .wrap { margin: 0; border-radius: 0; min-height: 100dvh; box-shadow: none; }
    }

    .topbar { display: flex; align-items: center; gap: 14px; min-height: 24px; margin-bottom: 36px; }
    .progress { display: flex; gap: 6px; flex: 1; }
    .seg { flex: 1; height: 4px; border-radius: 999px; background: var(--line); transition: background 0.2s; }
    .seg.on { background: var(--blue); }
    .back {
      background: none; border: none; padding: 4px; margin: -4px;
      color: var(--muted); font-size: 1.1rem; font-family: inherit; cursor: pointer;
      line-height: 1;
    }
    .back:hover { color: var(--text); }
    .back[hidden] { display: none; }

    h2.q {
      font-size: 1.55rem; line-height: 1.3; letter-spacing: -0.2px; font-weight: 600;
      margin: 0 0 24px; text-align: center;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 100px; padding: 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      color: var(--text); font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s, transform 0.1s;
    }
    .tile:hover, .tile:focus-visible { border-color: var(--blue); box-shadow: var(--shadow-1); outline: none; }
    .tile:active { transform: scale(0.97); }
    .tile .emoji { font-size: 1.7rem; line-height: 1; }
    .tile .sub { font-size: 0.78rem; font-weight: 500; color: var(--muted); }
    .tile.picked { background: var(--blue); border-color: var(--blue); color: #fff; }
    .tile.picked .sub { color: var(--blue-tint); }

    /* Results: a live map up top plus a Maps-style bottom sheet, so the best
       pick and its alternates read like pins you're browsing on a real map. */
    .map-wrap { position: relative; width: 100%; height: 38vh; min-height: 200px; max-height: 320px; background: #e8eaed; }
    .map-frame { width: 100%; height: 100%; }
    .map-pill {
      position: absolute; left: 14px; top: 14px; max-width: calc(100% - 28px);
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); padding: 6px 14px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: var(--text); box-shadow: var(--shadow-1);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .map-pill .ping { flex: none; width: 8px; height: 8px; border-radius: 999px; background: var(--red); }

    .sheet {
      position: relative; margin-top: -18px;
      background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 18px 20px 24px; flex: 1;
      box-shadow: 0 -2px 10px rgba(60,64,67,.12);
    }
    .handle { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 16px; }

    .pick-top { display: flex; align-items: flex-start; gap: 10px; }
    .pick-top .pin { font-size: 1.5rem; line-height: 1.3; }
    .pick-title { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.2px; }
    .badge {
      align-self: flex-start; background: var(--green-tint); color: var(--green);
      font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .blurb { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin: 10px 0 0; white-space: pre-wrap; text-align: left; }

    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      flex: 1; text-align: center; padding: 12px; border: none; border-radius: 999px;
      background: var(--blue); color: #fff; font-family: inherit; font-weight: 600; font-size: 0.95rem;
      text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .btn:hover { background: var(--blue-dark); box-shadow: var(--shadow-1); }
    .btn:active { transform: scale(0.98); }
    .btn.ghost { background: var(--surface); color: var(--blue); border: 1px solid var(--line); }
    .btn.ghost:hover { background: #f8f9fa; box-shadow: none; }

    .alt-label {
      font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 22px 0 10px;
    }
    .alt-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .alt-row::-webkit-scrollbar { display: none; }
    .alt-card {
      flex: 0 0 auto; max-width: 200px; display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 10px 14px; font-family: inherit; font-size: 0.86rem; font-weight: 600;
      color: var(--text); cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .alt-card:hover, .alt-card:focus-visible { border-color: var(--blue); background: var(--blue-tint); outline: none; }
    .alt-card .alt-pin { color: var(--blue); flex: none; }
    .alt-card .alt-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status { text-align: center; color: var(--muted); }
    .err { color: var(--red); }
    .loc {
      text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 26px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    #stage { animation: fadeUp 0.18s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #stage { animation: none; }
      .tile, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage"></div>
  </div>

  <script>
    // Google bootstrap
    (g => {var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "{{ maps_api_key }}",
      v: "weekly",
    });
  </script>
  <script>
    const STEPS = [
      { key: 'mood', title: "What's the mood?", options: [
          { label: 'Cozy', emoji: '🕯️' },
          { label: 'Adventurous', emoji: '🌶️' },
          { label: 'Celebratory', emoji: '🥂' },
          { label: 'Comfort', emoji: '🍲' },
          { label: 'Healthy', emoji: '🥗' },
          { label: 'Indulgent', emoji: '🧁' },
        ] },
      { key: 'food', title: 'What are you craving?', options: [
          { label: 'Mexican', emoji: '🌮' },
          { label: 'Italian', emoji: '🍝' },
          { label: 'Chinese', emoji: '🥡' },
          { label: 'Japanese', emoji: '🍣' },
          { label: 'American', emoji: '🍔' },
          { label: 'Thai', emoji: '🍜' },
          { label: 'Indian', emoji: '🍛' },
          { label: 'Cafe', emoji: '☕' },
          { label: 'Surprise me', emoji: '🎲' },
        ] },
      // `label` stays a bare number — the server writes "a {walk}-minute walk".
      { key: 'walk', title: 'How far will you walk?', options: [
          { label: '5', emoji: '🚶', sub: '5 min' },
          { label: '10', emoji: '🚶', sub: '10 min' },
          { label: '15', emoji: '🥾', sub: '15 min' },
          { label: '30', emoji: '🗺️', sub: '30 min' },
        ] },
      { key: 'budget', title: "What's the budget?", options: [
          { label: '$', emoji: '🪙', sub: 'Cheap eats' },
          { label: '$$', emoji: '💵', sub: 'Casual' },
          { label: '$$$', emoji: '💳', sub: 'Nice out' },
          { label: '$$$$', emoji: '💎', sub: 'Special' },
        ] },
    ];

    // Falls back to downtown LA — mirrors the server's default in app.py.
    const DEFAULT_LAT = 34.050481;
    const DEFAULT_LON = -118.248526;

    const selections = {};
    let coords = { latitude: null, longitude: null };
    let step = 0;
    let places = [];
    let pickIndex = 0;
    let blurb = '';
    let locText = '📍 Using your current location';

    let map = null;
    let markersByIndex = {};

    const stage = document.getElementById('stage');

    // Grab geolocation. If fail, use the default.
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coords.latitude = pos.coords.latitude;
          coords.longitude = pos.coords.longitude;
          locText = '📍 Using your current location';
          updateLoc();
        },
        () => {
          locText = '📍 Location off — using a default area';
          updateLoc();
        }
      );
    }

    function updateLoc() {
      const el = stage.querySelector('.loc');
      if (el) el.textContent = locText;
    }

    function renderStep() {
      const s = STEPS[step];
      const segs = STEPS.map((_, i) => '<div class="seg' + (i <= step ? ' on' : '') + '"></div>').join('');
      const tiles = s.options.map((o, i) =>
        '<button class="tile" data-i="' + i + '">' +
          (o.emoji ? '<span class="emoji">' + o.emoji + '</span>' : '') +
          '<span>' + escapeHtml(o.sub || o.label) + '</span>' +
        '</button>'
      ).join('');

      stage.innerHTML =
        '<div class="pad">' +
        '<div class="topbar"><button class="back"' + (step === 0 ? ' hidden' : '') + '>←</button>' +
        '<div class="progress">' + segs + '</div></div>' +
        '<h2 class="q">' + escapeHtml(s.title) + '</h2>' +
        '<div class="tiles">' + tiles + '</div>' +
        '<div class="loc">' + escapeHtml(locText) + '</div>' +
        '</div>';
      restage();

      const back = stage.querySelector('.back');
      if (back) back.addEventListener('click', goBack);

      stage.querySelectorAll('.tile').forEach((tile) => {
        tile.addEventListener('click', () => pick(tile));
      });
    }

    function pick(tile) {
      const s = STEPS[step];
      const opt = s.options[Number(tile.dataset.i)];
      selections[s.key] = opt.label;
      stage.querySelectorAll('.tile').forEach((t) => t.classList.remove('picked'));
      tile.classList.add('picked');
      stage.querySelectorAll('.tile').forEach((t) => (t.disabled = true));
      setTimeout(() => {
        if (step < STEPS.length - 1) {
          step += 1;
          renderStep();
        } else {
          submit();
        }
      }, 140);
    }

    function goBack() {
      if (step === 0) return;
      step -= 1;
      delete selections[STEPS[step].key];
      renderStep();
    }

    document.addEventListener('keydown', (e) => {
      const tiles = stage.querySelectorAll('.tile');
      if (e.key === 'Escape' || e.key === 'Backspace') {
        const back = stage.querySelector('.back');
        if (back && !back.hidden) { e.preventDefault(); goBack(); }
        return;
      }
      if (/^[1-9]$/.test(e.key) && tiles.length) {
        const t = tiles[Number(e.key) - 1];
        if (t && !t.disabled) pick(t);
      }
    });

    async function submit() {
      stage.innerHTML = '<div class="pad"><div class="status">Sniffing out the best spots… 🍜</div></div>';
      restage();

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...selections, ...coords }),
        });
        const data = await res.json();

        if (data.error) {
          showMessage('Hmm: ' + data.error, true);
          return;
        }

        places = data.places || [];
        blurb = data.text || '';
        pickIndex = 0;
        map = null;
        markersByIndex = {};

        if (!places.length && !blurb) {
          showMessage('No matches — try a different combo.');
        } else {
          renderResults();
        }
      } catch (e) {
        showMessage('Something went wrong. Is the server running?', true);
      }
    }

    // Draws the map + bottom-sheet shell once, then loads the live map async
    // so the sheet (top pick + alternates) is usable even if maps can't load.
    function renderResults() {
      const hasMap = places.some((p) => p.place_id);
      let html = '';
      if (hasMap) {
        html += '<div class="map-wrap"><div id="map" class="map-frame"></div>' +
          '<div class="map-pill"><span class="ping"></span><span id="mapPillText">Loading map…</span></div></div>';
      }
      html += '<div class="sheet"><div class="handle"></div><div id="sheetBody"></div></div>';

      stage.innerHTML = html;
      restage();
      renderSheet();

      if (hasMap) {
        setupMap().catch(() => {
          const pillText = document.getElementById('mapPillText');
          if (pillText) pillText.textContent = 'Map unavailable';
        });
      }
    }

    async function setupMap() {
      const { Map } = await google.maps.importLibrary('maps');
      await google.maps.importLibrary('marker');
      const { Place } = await google.maps.importLibrary('places');

      const mapEl = document.getElementById('map');
      if (!mapEl) return; // user already navigated away

      map = new Map(mapEl, {
        center: { lat: coords.latitude || DEFAULT_LAT, lng: coords.longitude || DEFAULT_LON },
        zoom: 14,
        disableDefaultUI: true,
        zoomControl: true,
        gestureHandling: 'greedy',
      });

      const bounds = new google.maps.LatLngBounds();
      markersByIndex = {};

      for (let i = 0; i < places.length; i++) {
        const p = places[i];
        if (!p.place_id) continue;
        try {
          const place = new Place({ id: p.place_id.replace(/^places\//, '') });
          await place.fetchFields({ fields: ['location'] });
          if (!place.location) continue;
          const marker = new google.maps.Marker({
            position: place.location,
            map,
            title: p.name,
            icon: markerIcon(i === pickIndex),
            zIndex: i === pickIndex ? 999 : 1,
          });
          marker.addListener('click', () => selectPlace(i));
          markersByIndex[i] = { marker, location: place.location };
          bounds.extend(place.location);
        } catch (e) {
          // Skip a place we can't locate rather than failing the whole map.
        }
      }

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, 60);
        if (Object.keys(markersByIndex).length === 1) map.setZoom(15);
      }

      const pillText = document.getElementById('mapPillText');
      if (pillText) pillText.textContent = places[pickIndex] ? places[pickIndex].name : 'Map';
    }

    function markerIcon(isTop) {
      return { url: 'https://maps.google.com/mapfiles/ms/icons/' + (isTop ? 'red-dot.png' : 'blue-dot.png') };
    }

    function selectPlace(i) {
      pickIndex = i;
      Object.entries(markersByIndex).forEach(([idx, entry]) => {
        const isTop = Number(idx) === i;
        entry.marker.setIcon(markerIcon(isTop));
        entry.marker.setZIndex(isTop ? 999 : 1);
      });
      const entry = markersByIndex[i];
      if (entry && map) map.panTo(entry.location);
      const pillText = document.getElementById('mapPillText');
      if (pillText) pillText.textContent = places[i].name;
      renderSheet();
    }

    // Rewrites just the bottom sheet (top pick + alternates) without touching
    // the map, so switching picks doesn't reload/re-fetch markers.
    function renderSheet() {
      const body = document.getElementById('sheetBody');
      if (!body) return;

      const p = places[pickIndex];
      const alts = places
        .map((place, i) => ({ place, i }))
        .filter(({ i }) => i !== pickIndex)
        .slice(0, 3);

      let html = '';
      if (p) {
        const copy = p.reason || blurb;
        html += '<div class="pick-top"><span class="pin">📍</span>' +
          '<div class="pick-title"><span class="name">' + escapeHtml(p.name) + '</span>' +
          '<span class="badge">Top pick</span></div></div>';
        if (copy) html += '<p class="blurb">' + escapeHtml(copy) + '</p>';
        html += '<div class="actions"><a class="btn" id="directions" target="_blank" rel="noopener">Directions</a>' +
          '<button class="btn ghost" id="restart">Start over</button></div>';
      } else {
        if (blurb) html += '<p class="blurb">' + escapeHtml(blurb) + '</p>';
        html += '<div class="actions"><button class="btn ghost" id="restart">Start over</button></div>';
      }

      if (alts.length) {
        html += '<div class="alt-label">Other options nearby</div><div class="alt-row">';
        alts.forEach(({ place, i }) => {
          html += '<button class="alt-card" data-i="' + i + '"><span class="alt-pin">📍</span>' +
            '<span class="alt-name">' + escapeHtml(place.name) + '</span></button>';
        });
        html += '</div>';
      }

      body.innerHTML = html;

      // Set href via the DOM so a hostile URL can't break out of the attribute.
      const directions = document.getElementById('directions');
      if (directions) {
        if (p && p.url) directions.href = p.url;
        else directions.remove();
      }

      body.querySelectorAll('.alt-card').forEach((btn) => {
        btn.addEventListener('click', () => selectPlace(Number(btn.dataset.i)));
      });
      const restartBtn = document.getElementById('restart');
      if (restartBtn) restartBtn.addEventListener('click', restart);
    }

    function showMessage(msg, isErr) {
      stage.innerHTML = '<div class="pad"><div class="status' + (isErr ? ' err' : '') + '">' + escapeHtml(msg) + '</div>' +
        '<div class="actions"><button class="btn" id="restart">Start over</button></div></div>';
      restage();
      document.getElementById('restart').addEventListener('click', restart);
    }

    function restart() {
      STEPS.forEach((s) => delete selections[s.key]);
      places = [];
      blurb = '';
      pickIndex = 0;
      map = null;
      markersByIndex = {};
      step = 0;
      renderStep();
    }

    // Retrigger the fade-up animation on each render.
    function restage() {
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    renderStep();
  </script>
</body>
</html>
